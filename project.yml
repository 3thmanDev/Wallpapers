name: Wallpapers

options:
  bundleIdPrefix: com.app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"

targets:
  Wallpapers:
    type: application
    platform: iOS
    sources:
      - path: Wallpapers
      # Harvest.txt is loaded at run time, so it has to be copied, not compiled.
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.app.wallpapers
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Support/Info.plist

schemes:
  Wallpapers:
    build:
      targets:
        Wallpapers: all
    run:
      config: Debug
    archive:
      config: Release
